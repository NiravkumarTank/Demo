<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Creation</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        #main {
            width: 100%;
            text-align: center;
            background-color: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .admin-link {
            margin-left: 63px;
            font-size: x-large;
            color: white;
            text-decoration: none;
        }

        .admin-link a {
            color: white;
            text-decoration: none;
        }

        .admin-link a:hover {
            color: rgb(91, 241, 141);
            text-decoration: none;
            transition: 0.5s;
        }

        .nav__link {
            margin-right: 46px;
        }

        .nav__link ul {
            list-style: none;
            gap: 40px;
            display: flex;
            justify-content: flex-start;
            text-align: center;
            padding-left: 40px;
        }

        nav ul li a {
            text-decoration: none;
            color: aliceblue;
            transition: 0.3s;
            padding: 10px;
            display: inline-block;
        }

        nav ul li a:hover {
            background-color: rgba(186, 254, 231, 0.894);
            border-radius: 10px;
            color: #000;
        }


        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th {
            background-color: #333;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .delete-btn {
            padding: 6px 12px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background-color: darkred;
        }

        img {
            max-width: 100px;
            height: auto;
        }

        .cancel-btn {
            padding: 6px 12px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }

      

        .cancel-btn:hover {
            background-color: rgb(172, 16, 16);
        }
    </style>
</head>

<body>
    <div id="main">
        <div class="admin-link">
            <a href="#">Admin</a>
        </div>
        <div id="menus">
            <nav class="nav__link">
                <ul>
                    <li><a href="../homepage/indexhome.html">Home</a></li>
                    <li><a href="../Category/Category.html">Add Category</a></li>
                    <li><a href="../Product/index.html">Add Product</a></li>
                    <li><a href="#">All User</a></li>
                    <li><a href="#" id="logoutBtn">LogOut</a></li>
                </ul>
            </nav>
        </div>

    </div>

    <table id="dataTable">
        <thead>
            <tr>
                <th>FirstName</th>
                <th>LastName</th>
                <th>Email</th>
                <th>PhoneNumber</th>
                <th>Gender</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
    <script>


        $("#logoutBtn").click(function () {
            sessionStorage.clear();
            window.location.href = "../../User/Login/Login.html";
        });
        $.get("https://localhost:7262/api/User/GetAllUser", function (data, status) {
            var tableBody = $("#tableBody");
            tableBody.empty();

            console.log(data);
            
            if (data && data.length > 0) {
                data.forEach(function (item) {
                    var row = "<tr>" +
                        "<td>" + item.firstName + "</td>" +
                        "<td>" + item.lastName + "</td>" +
                        "<td>" + item.email + "</td>" +
                        "<td>" + item.phoneNumber + "</td>" +
                        "<td>" + item.gender + "</td>" +

                        "<td><button class='cancel-btn' data-user-id='" + item.userId + "'>Remove</button></td>" +

                        "</tr>";
                    tableBody.append(row);
                });
            } else {
                tableBody.append("<tr><td colspan='7'>No data available</td></tr>");
            }

            $(".cancel-btn").click(function () {
                var userId = $(this).data('user-id');

                if (confirm("Are you sure you want to delete this user?")) {
                    $.ajax({
                        url: "https://localhost:7262/api/User/DeleteById/" + userId,
                        type: "DELETE",
                        success: function (response) {
                            location.reload();
                        },
                        error: function (error) {
                            alert("Error deleting user.");
                            console.error(error);
                        }
                    });
                }
            });

        });


    </script>
</body>

</html>
